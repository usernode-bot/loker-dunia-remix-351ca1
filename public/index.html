    AE: 'AED', BR: 'BRL', NG: 'NGN', IN: 'INR', MY: 'MYR', CH: 'CHF', ZA: 'ZAR', KE: 'KES', MX: 'MXN',

    ID: 'WIB (UTC+7)', SG: 'SGT (UTC+8)', JP: 'JST (UTC+9)', DE: 'CET (UTC+1)', GB: 'GMT (UTC+0)',
    US: 'ET (UTC-5)', CA: 'ET (UTC-5)', AU: 'AEST (UTC+10)', AE: 'GST (UTC+4)', BR: 'BRT (UTC-3)',
    NG: 'WAT (UTC+1)', KE: 'EAT (UTC+3)', IN: 'IST (UTC+5:30)', NL: 'CET (UTC+1)', MY: 'MYT (UTC+8)',

    MX: 'CST (UTC-6)',
  };

  const CATEGORIES = ['it', 'health', 'education', 'finance', 'engineering', 'creative', 'marketing', 'sales', 'hospitality', 'logistics', 'agriculture'];
  const JOB_TYPES = ['fulltime', 'parttime', 'internship', 'contract'];

  // Skill catalogue that powers autocomplete. Users may still type their own.

    'Manajemen Reservasi', 'Opera PMS', 'Revenue Management', 'Barista', 'Food Safety', 'Zendesk', 'HubSpot CRM',
    'Penjualan B2B', 'Negosiasi', 'SolidWorks', 'AutoCAD', 'Civil 3D', 'CAD', 'FEA', 'GD&T', 'Six Sigma',
    'Structural Analysis', 'Agronomi', 'Analisis Tanah', 'Riset',

  /* ==========================================================================
     Interface text lives in public/i18n/<code>.js, one file per language,
     listed in public/i18n/languages.js. English is the default and the
     fallback for missing keys; any other file is loaded when it is chosen.
     Job content written by employers stays in the language it was posted in.
     ========================================================================== */
  const LANG_META = Object.fromEntries((window.LOKER_LANGS || []).map(l => [l.code, l]));
  const LANGS = Object.keys(LANG_META);
  const DEFAULT_LANG = 'en';
  // Loads public/i18n/<code>.js once. Resolves when its strings are registered.
  const langLoads = {};
  function loadLang(code) {
    if (window.LOKER_I18N[code]) return Promise.resolve();
    return langLoads[code] = langLoads[code] || new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = '/i18n/' + code + '.js';
      s.onload = () => window.LOKER_I18N[code] ? resolve() : reject(new Error('no strings for ' + code));
      s.onerror = () => reject(new Error('could not load ' + code));
      document.head.appendChild(s);
    }).catch(e => { delete langLoads[code]; throw e; });
  }

  /* ==========================================================================
     State: a client-side cache of what the server returned. The server
     (lib/routes.js, Postgres) owns every record; `api` below is the only code
     that talks to it, and it keeps this cache in step after each write.
     ========================================================================== */
  const PREF_KEY = 'lokerdunia.prefs';
  const DAY = 86400000;
  const db = { companies: [], profiles: [], skills: [], certificates: [], jobs: [], applications: [], savedJobIds: [] };
  // { userId, username, role, activeCompanyId, profileId, ownedCompanyIds, demoCompanyIds }
  let me = null;
  let loadState = 'loading';

  function readJson(key) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  // prefs.lang is only set when the viewer picks a language themselves.
  const prefs = Object.assign({ cur: 'local' }, readJson(PREF_KEY) || {});
  // The viewer's saved choice; English until they pick another.
  let lang = LANGS.includes(prefs.lang) ? prefs.lang : DEFAULT_LANG;
  function savePrefs() { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {} }

  // Homeroom identity (display only; the server already verified the token).
  const TOKEN = new URLSearchParams(location.search).get('token') || '';
  const HR_USER = (() => {
    try { const p = JSON.parse(atob(TOKEN.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); return p.username || null; }
    catch (e) { return null; }
  })();

  /* ---------- small helpers ---------- */
  function uid(p) { return p + Math.random().toString(36).slice(2, 10); }
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function t(key, vars) {
    const cur = window.LOKER_I18N[lang];
    let s = (cur && cur.strings[key]) ?? window.LOKER_I18N[DEFAULT_LANG].strings[key] ?? key;
    if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
    return s;
  }
  function locale() { return (LANG_META[lang] && LANG_META[lang].locale) || lang; }
  function flag(cc) {
    if (!cc || cc.length !== 2) return '🌐';
    return String.fromCodePoint(...cc.toUpperCase().split('').map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
  }
  const nameCache = {};
  function displayName(type, code) {
    const k = lang + type;
    try { nameCache[k] = nameCache[k] || new Intl.DisplayNames([lang], { type }); return nameCache[k].of(code) || code; }
    catch (e) { return code; }
  }
  const countryName = cc => displayName('region', cc);
  const langName = code => displayName('language', code);
  function sortedCountries() { return COUNTRY_CODES.slice().sort((a, b) => countryName(a).localeCompare(countryName(b), lang)); }

  function fmtMoney(amount, cur, compact) {
    try {
      return new Intl.NumberFormat(locale(), { style: 'currency', currency: cur, notation: compact ? 'compact' : 'standard', maximumFractionDigits: compact ? 1 : 0 }).format(amount);
    } catch (e) { return cur + ' ' + Math.round(amount); }
  }
  function convert(amount, from, to) { return amount / RATES[from] * RATES[to]; }
  function monthly(amount, period) { return period === 'year' ? amount / 12 : period === 'hour' ? amount * 160 : amount; }
  function salaryText(j) {
    return fmtMoney(j.salaryMin, j.currency, true) + '–' + fmtMoney(j.salaryMax, j.currency, true) + t('per_' + j.period);
  }
  function salaryConverted(j) {
    const to = prefs.cur;
    if (to === 'local' || to === j.currency || !RATES[j.currency]) return '';
    return '≈ ' + fmtMoney(convert(j.salaryMin, j.currency, to), to, true) + '–' + fmtMoney(convert(j.salaryMax, j.currency, to), to, true) + t('per_' + j.period);
  }
  function fmtDate(iso, opts) {
    if (!iso) return '';
    const d = new Date(iso.length <= 7 ? iso + '-01' : iso);
    if (isNaN(d)) return '';
    return new Intl.DateTimeFormat(locale(), opts || { day: 'numeric', month: 'short', year: 'numeric' }).format(d);
  }
  function fmtMonth(ym) { return fmtDate(ym, { month: 'short', year: 'numeric' }); }
  function relDays(iso) {
    const days = Math.round((Date.now() - new Date(iso).getTime()) / DAY);
    try { return new Intl.RelativeTimeFormat(lang, { numeric: 'auto' }).format(-days, 'day'); } catch (e) { return days + 'd'; }
  }
  function fmtNum(n) { return new Intl.NumberFormat(locale(), { maximumFractionDigits: 1 }).format(n); }
  function today() { return new Date().toISOString().slice(0, 10); }

  /* ---------- lookups ---------- */
  const currentUser = () => (me && me.role ? me : null);
  const role = () => (me && me.role) || 'guest';
  const getProfile = id => db.profiles.find(p => p.id === id) || null;
  const myProfile = () => (me && me.profileId ? getProfile(me.profileId) : null);
  const myCompany = () => (me && me.role === 'company' && me.activeCompanyId ? db.companies.find(c => c.id === me.activeCompanyId) || null : null);
  const getJob = id => db.jobs.find(j => j.id === id) || null;
  const companyOf = j => db.companies.find(c => c.id === j.companyId) || { name: '?', id: '' };
  const skillsOf = pid => db.skills.filter(s => s.profileId === pid);
  const certsOf = pid => db.certificates.filter(c => c.profileId === pid);
  // Hidden certificates are not sent at all, so counts come from the server.
  const certCount = p => (p.certCount != null ? p.certCount : certsOf(p.id).length);
  const jobSkills = j => j.required.concat(j.nice).map(s => s.name);
  const isSaved = id => db.savedJobIds.includes(id);

  function certExpired(c) { return !!c.expiryDate && c.expiryDate < today(); }
  // certified: a valid certificate proves it; expired: only expired ones do; none.
  function skillProof(pid, name) {
    const n = name.toLowerCase();
    const held = skillsOf(pid).find(s => s.name.toLowerCase() === n);
    if (held && held.proof) return held.proof;
    const cs = certsOf(pid).filter(c => (c.skills || []).some(s => s.toLowerCase() === n));
    if (!cs.length) return 'none';
    return cs.some(c => !certExpired(c)) ? 'certified' : 'expired';
  }
  function experienceYears(p) {
    let months = 0;
    (p.experience || []).forEach(x => {
      if (!x.start) return;
      const [sy, sm] = x.start.split('-').map(Number);
      const endStr = x.current || !x.end ? today().slice(0, 7) : x.end;
      const [ey, em] = endStr.split('-').map(Number);
      months += Math.max(0, (ey - sy) * 12 + (em - sm));
    });
    return Math.round(months / 12 * 10) / 10;
  }

  // Match score. Required skills weigh 2, nice-to-have 1. A skill held at the
  // asked level counts fully, one level below 60%, two below 30%. Proof
  // multiplier: certified 100%, uncertified or expired 75%.
  const PROOF_WEIGHT = { certified: 1, expired: 0.75, none: 0.75 };
  function matchJob(job, pid) {
    const mine = {};
    skillsOf(pid).forEach(s => { mine[s.name.toLowerCase()] = s; });
    let total = 0, got = 0;
    const matched = [], missing = [];
    [[job.required, 2, 'req'], [job.nice, 1, 'nice']].forEach(([list, w, kind]) => list.forEach(s => {
      total += w;
      const u = mine[s.name.toLowerCase()];
      if (!u) { missing.push({ ...s, kind }); return; }
      const f = u.level >= s.level ? 1 : (u.level === s.level - 1 ? 0.6 : 0.3);
      const proof = skillProof(pid, s.name);
      got += w * f * PROOF_WEIGHT[proof];
      if (f < 1) missing.push({ ...s, kind, have: u.level });
      else matched.push({ ...s, kind, proof });
    }));
    return { pct: total ? Math.round(got / total * 100) : 0, matched, missing };
  }

  function completeness(p) {
    const items = [
      ['photo', 10, !!p.photo],
      ['bio', 15, !!(p.fullName && p.birthDate && p.country && p.city && p.email)],
      ['phone', 5, !!p.phone],
      ['summary', 10, (p.summary || '').length >= 30],
      ['education', 15, (p.education || []).length > 0],
      ['experience', 15, (p.experience || []).length > 0],
      ['skills', 15, skillsOf(p.id).length >= 3],
      ['languages', 5, (p.languages || []).length > 0],
      ['certs', 10, certCount(p) > 0],
    ];
    const pct = items.reduce((s, [, w, ok]) => s + (ok ? w : 0), 0);
    return { pct, missing: items.filter(i => !i[2]).map(i => i[0]) };
  }

  /* ---------- api: the only code that talks to the server ---------- */
  async function request(method, path, body) {
    const headers = { 'content-type': 'application/json' };
    if (TOKEN) headers['x-usernode-token'] = TOKEN;
    const res = await fetch('/api' + path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) { const err = new Error((data && data.error) || 'http_' + res.status); err.status = res.status; err.code = data && data.error; throw err; }
    return data;
  }
  function mergeProfile(p) {
    const { skills, certificates, ...rest } = p;
    db.profiles = db.profiles.filter(x => x.id !== p.id).concat(rest);
    db.skills = db.skills.filter(x => x.profileId !== p.id).concat(skills);
    db.certificates = db.certificates.filter(x => x.profileId !== p.id).concat(certificates);
  }
  const api = {
    async bootstrap() {
      const d = await request('GET', '/bootstrap');
      me = d.me;
      db.companies = d.companies; db.jobs = d.jobs; db.savedJobIds = d.savedJobIds;
      db.applications = d.applications;
      db.profiles = []; db.skills = []; db.certificates = [];
      if (d.profile) mergeProfile(d.profile);
    },
    async searchJobs(f) { await sleep(150); return filterJobs(f); },
    async getJob(id) { await sleep(150); return getJob(id); },
    async setRole(role, companyId) {
      const d = await request('POST', '/me/role', { role, companyId });
      me.role = d.role; me.activeCompanyId = d.activeCompanyId;
    },
    async createCompany(body) {
      const { company } = await request('POST', '/companies', body);
      db.companies.push(company); me.ownedCompanyIds.push(company.id);
      me.role = 'company'; me.activeCompanyId = company.id;
      return company;
    },
    async saveProfile(payload) {
      const { profile } = await request('PUT', '/profile', payload);
      mergeProfile(profile); me.profileId = profile.id; me.role = 'seeker'; me.activeCompanyId = null;
      return profile;
    },
    async setPrivacy(privacy) {
      const d = await request('PUT', '/profile/privacy', privacy);
      const p = myProfile(); if (p) p.privacy = d.privacy;
    },
    async loadProfile(id) {
      const { profile } = await request('GET', '/profiles/' + encodeURIComponent(id));
      if (!(me && me.profileId === id)) mergeProfile(profile);
      return profile;
    },
    async apply(jobId, certIds, message) {
      const { application } = await request('POST', '/jobs/' + encodeURIComponent(jobId) + '/apply', { certIds, message });
      db.applications.unshift(application); return application;
    },
    async createJob(job) { const d = await request('POST', '/jobs', job); db.jobs.unshift(d.job); return d.job; },
    // Every application to one company's jobs, from any applicant's device.
    async loadCompanyApplications(companyId) {
      const d = await request('GET', '/companies/' + encodeURIComponent(companyId) + '/applications');
      const ids = new Set(d.applications.map(a => a.id));
      db.applications = db.applications.filter(a => !ids.has(a.id)).concat(d.applications);
      d.profiles.forEach(p => { if (!(me && me.profileId === p.id)) mergeProfile(p); });
    },
    async setStatus(appId, status) {
      const { application } = await request('PATCH', '/applications/' + encodeURIComponent(appId), { status });
      const a = db.applications.find(x => x.id === appId); if (a) a.status = application.status;
      return application;
    },
    async toggleBookmark(jobId) {
      const was = isSaved(jobId);
      db.savedJobIds = was ? db.savedJobIds.filter(x => x !== jobId) : [jobId].concat(db.savedJobIds);
      try { await request(was ? 'DELETE' : 'PUT', '/saved/' + encodeURIComponent(jobId)); }
      catch (e) { db.savedJobIds = was ? [jobId].concat(db.savedJobIds) : db.savedJobIds.filter(x => x !== jobId); throw e; }
      return !was;
    },
  };

  // Files go to the platform's storage through the bridge; only the returned
  // URL is saved. Platform storage takes images only, and it is missing when
  // the app runs outside Homeroom, so callers get null there and say so.
  function dataUrlToFile(dataUrl, name) {
    const [head, b64] = dataUrl.split(',');
    const type = head.slice(5, head.indexOf(';'));
    const bin = atob(b64); const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const ext = type === 'image/png' ? '.png' : type === 'image/webp' ? '.webp' : '.jpg';
    return new File([arr], (name || 'file').replace(/\.[^.]+$/, '') + ext, { type });
  }
  async function uploadImage(dataUrl, name, visibility) {
    if (!(window.usernode && typeof usernode.uploadFile === 'function')) return null;
    try { return await usernode.uploadFile(dataUrlToFile(dataUrl, name), { visibility }); }
    catch (e) { console.warn('upload unavailable: ' + (e && e.message)); return null; }
  }
  // Private platform files need the viewer's token on the image request.
  function fileSrc(file) {
    if (!file) return '';
    if (file.dataUrl) return file.dataUrl;
    if (!file.url) return '';
    if (TOKEN && file.url.includes('/app-files/')) return file.url + (file.url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN);
    return file.url;
  }

  /* ---------- search ---------- */
  const emptyFilters = () => ({ q: '', country: '', city: '', category: '', types: [], models: [], salaryMin: '', salaryMax: '', skills: [], rw: false, visa: false, relo: false });
  let filters = emptyFilters();
  const ui = { matchMode: false, sort: 'newest' };
  function filterCurrency() { return prefs.cur === 'local' ? 'USD' : prefs.cur; }
  function filterJobs(f) {
    const words = f.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const fc = filterCurrency();
    return db.jobs.filter(j => {
      if (words.length) {
        const hay = [j.title, companyOf(j).name, j.city, countryName(j.country), t('cat_' + j.category)].concat(jobSkills(j)).join(' ').toLowerCase();
        if (!words.every(w => hay.includes(w))) return false;
      }
      if (f.country && j.country !== f.country) return false;
      if (f.city && !j.city.toLowerCase().includes(f.city.trim().toLowerCase())) return false;
      if (f.category && j.category !== f.category) return false;
      if (f.types.length && !f.types.includes(j.type)) return false;
      if (f.models.length && !f.models.includes(j.model)) return false;
      if (f.skills.length && !f.skills.every(s => jobSkills(j).some(x => x.toLowerCase() === s.toLowerCase()))) return false;
      if (f.rw && !j.remoteWorldwide) return false;
      if (f.visa && !j.visaSponsor) return false;
      if (f.relo && !j.relocation) return false;
      const lo = convert(monthly(j.salaryMin, j.period), j.currency, fc);
      const hi = convert(monthly(j.salaryMax, j.period), j.currency, fc);
      if (f.salaryMin !== '' && hi < Number(f.salaryMin)) return false;
      if (f.salaryMax !== '' && lo > Number(f.salaryMax)) return false;
      return true;
    });
  }
  function sortJobs(list) {
    const p = myProfile();
    const usd = j => convert(monthly(j.salaryMax, j.period), j.currency, 'USD');
    if (ui.matchMode && p) return list.slice().sort((a, b) => matchJob(b, p.id).pct - matchJob(a, p.id).pct);
    if (ui.sort === 'salary') return list.slice().sort((a, b) => usd(b) - usd(a));
    return list.slice().sort((a, b) => b.postedAt.localeCompare(a.postedAt));

  let modalClose = null;

    opts = opts || {};

    modalClose = () => { root.innerHTML = ''; modalClose = null; if (opts.onClose) opts.onClose(); if (prevFocus && prevFocus.focus) prevFocus.focus({ preventScroll: true }); };
    const first = root.querySelector('[autofocus]') || root.querySelector('input,select,textarea,button:not([data-action="modal-close"])');
    if (first) first.focus({ preventScroll: true });

  function closeModal() { if (modalClose) modalClose(); }

  /* ---------- pickers ---------- */
  // Interface language: every entry in public/i18n/languages.js, by its own
  // name with its name in the current language underneath. Searchable.
  function openLanguagePicker() {
    const en = new Intl.DisplayNames(['en'], { type: 'language' });
    const enName = c => { try { return en.of(c) || c; } catch (e) { return c; } };
    const list = LANGS.slice().sort((a, b) => (a === lang ? -1 : b === lang ? 1 : langName(a).localeCompare(langName(b), lang)));
    const row = c => {
      const m = LANG_META[c], here = langName(c), on = c === lang;
      return '<li><button type="button" data-pick-lang="' + c + '" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-start hover:bg-slate-100 dark:hover:bg-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"' + (on ? ' aria-current="true"' : '') +
        ' data-search="' + esc([m.name, here, enName(c), c].join(' ').toLowerCase()) + '">' +
        '<span class="flex-1 min-w-0"><span lang="' + c + '" dir="' + m.dir + '" class="block text-sm' + (on ? ' font-semibold' : '') + '">' + esc(m.name) + '</span>' +
        (here !== m.name ? '<span class="block text-xs ' + C.muted + '">' + esc(here) + '</span>' : '') + '</span>' +
        (on ? '<span class="text-blue-600 dark:text-blue-400">' + icon('check', 'w-4 h-4') + '</span>' : '') + '</button></li>';
    };
    const root = openModal(
      '<input type="search" autofocus data-lang-search class="' + C.input + '" placeholder="' + esc(t('searchLanguage')) + '" aria-label="' + esc(t('searchLanguage')) + '">' +
      '<ul class="mt-3 space-y-0.5" data-testid="lang-list">' + list.map(row).join('') + '</ul>' +
      '<div data-lang-empty hidden class="py-8 text-center"><p class="font-medium">' + esc(t('noLanguage')) + '</p><p class="text-sm ' + C.muted + '">' + esc(t('noLanguageBody')) + '</p></div>',
      { title: t('appLanguage') });
    root.querySelector('[data-lang-search]').addEventListener('input', e => {
      const q = e.target.value.trim().toLowerCase();
      let shown = 0;
      root.querySelectorAll('[data-pick-lang]').forEach(b => {
        const hit = !q || b.dataset.search.includes(q);
        b.parentElement.hidden = !hit; if (hit) shown++;
      });
      root.querySelector('[data-lang-empty]').hidden = shown > 0;
    });
    root.querySelector('[data-testid=lang-list]').addEventListener('click', async e => {
      const b = e.target.closest('[data-pick-lang]'); if (!b) return;
      const code = b.dataset.pickLang;
      if (code === lang) { closeModal(); return; }
      b.setAttribute('aria-busy', 'true');
      try { await loadLang(code); }
      catch (err) { console.warn(err.message); b.removeAttribute('aria-busy'); toast(t('loadFailed')); return; }
      closeModal();
      lang = code; prefs.lang = code; savePrefs(); render();
    });
  }

  // Skill input with suggestions. Markup: a wrapper [data-skill-input="<key>"]
  // containing the input; handlers registered in SKILL_ADD[key](name).
  const SKILL_ADD = {};
  function skillInput(key, placeholder) {
    return '<div class="relative" data-skill-input="' + key + '"><div class="flex gap-2">' +
      '<input type="text" autocomplete="off" data-skill-text class="' + C.input + '" placeholder="' + esc(placeholder || t('typeSkill')) + '" aria-label="' + esc(placeholder || t('typeSkill')) + '" role="combobox" aria-expanded="false" aria-autocomplete="list">' +

      '<ul data-skill-suggest role="listbox" class="hidden absolute z-20 start-0 end-0 mt-1 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-lg overflow-hidden"></ul></div>';
  }
  function suggestSkills(q, exclude) {
    q = q.trim().toLowerCase(); if (!q) return [];
    const ex = (exclude || []).map(s => s.toLowerCase());
    const pool = Array.from(new Set(SKILL_CATALOG.concat(db.jobs.flatMap(jobSkills))));
    return pool.filter(s => s.toLowerCase().includes(q) && !ex.includes(s.toLowerCase()))
      .sort((a, b) => (a.toLowerCase().startsWith(q) ? 0 : 1) - (b.toLowerCase().startsWith(q) ? 0 : 1) || a.localeCompare(b)).slice(0, 6);
  }
  function canonicalSkill(name) {
    const n = name.trim(); const hit = SKILL_CATALOG.find(s => s.toLowerCase() === n.toLowerCase());
    return hit || n;
  }

    const jobs = db.jobs.filter(j => (!insight.country || j.country === insight.country) && (!insight.category || j.category === insight.category));
    const agg = {};
    jobs.forEach(j => {
      j.required.forEach(s => { const a = agg[s.name] = agg[s.name] || { n: 0, req: 0 }; a.n++; a.req++; });
      j.nice.forEach(s => { const a = agg[s.name] = agg[s.name] || { n: 0, req: 0 }; a.n++; });
    });
    const rows = Object.entries(agg).sort((a, b) => b[1].n - a[1].n || b[1].req - a[1].req || a[0].localeCompare(b[0])).slice(0, 25);
    const top = rows.length ? rows[0][1].n : 1;
    const p = myProfile(); const mine = new Set(p ? skillsOf(p.id).map(s => s.name.toLowerCase()) : []);
    const countries = Array.from(new Set(db.jobs.map(j => j.country))).sort((a, b) => countryName(a).localeCompare(countryName(b)));

          (mine.length ? '<div><h2 class="text-sm font-medium ' + C.muted + ' mb-2">' + t('yourAccounts') + '</h2><ul class="' + C.card + ' ' + C.divider + ' overflow-hidden">' + mine.map(acctRow).join('') + '</ul></div>'

      '</div>';

  let companyDraft = { name: '', country: '', city: '', industry: 'it', errors: {} };

  /* ---------- 4-step registration ---------- */
  let draft = null;
  function blankDraft() {
    return { step: 1, mode: 'create', profileId: null,
      bio: { photo: '', fullName: '', birthDate: '', gender: '', country: '', city: '', nationality: '', email: '', phoneCode: '', phone: '', summary: '' },
      education: [], experience: [], skills: [], languages: [], certificates: [],
      certForm: blankCert(), errors: {} };
  }
  function blankCert() { return { name: '', issuer: '', issueDate: '', expiryDate: '', verify: '', skills: [], file: null }; }
  function draftFromProfile(p) {
    return { step: 1, mode: 'edit', profileId: p.id,
      bio: { photo: p.photo || '', fullName: p.fullName, birthDate: p.birthDate, gender: p.gender, country: p.country, city: p.city, nationality: p.nationality, email: p.email, phoneCode: p.phoneCode, phone: p.phone, summary: p.summary },
      education: JSON.parse(JSON.stringify(p.education || [])), experience: JSON.parse(JSON.stringify(p.experience || [])),
      skills: skillsOf(p.id).map(s => ({ ...s })), languages: JSON.parse(JSON.stringify(p.languages || [])),
      certificates: certsOf(p.id).map(c => JSON.parse(JSON.stringify(c))), certForm: blankCert(), errors: {} };
  }
  function setPath(obj, path, val) {
    const ks = path.split('.'); let o = obj;
    for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
    o[ks[ks.length - 1]] = val;
  }
  function getPath(obj, path) { return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj); }

  const STEP_KEYS = ['stepBio', 'stepEduExp', 'stepSkills', 'stepCerts'];
  function field(path, label, opts) {
    opts = opts || {};
    const v = getPath(draft, path) ?? '';
    const e = draft.errors[path];
    const id = 'd-' + path.replace(/\./g, '-');
    const cls = e ? C.inputErr : C.input;
    let control;
    if (opts.type === 'textarea') control = '<textarea id="' + id + '" data-draft="' + path + '" rows="' + (opts.rows || 4) + '" class="' + cls + '"' + (opts.max ? ' maxlength="' + opts.max + '"' : '') + ' placeholder="' + esc(opts.ph || '') + '">' + esc(v) + '</textarea>';
    else if (opts.type === 'select') control = '<select id="' + id + '" data-draft="' + path + '" class="' + cls + '">' + (opts.blank ? '<option value="">' + esc(opts.blank) + '</option>' : '') + opts.options.map(([val, l]) => '<option value="' + esc(val) + '"' + (String(v) === String(val) ? ' selected' : '') + '>' + esc(l) + '</option>').join('') + '</select>';
    else control = '<input id="' + id + '" type="' + (opts.type || 'text') + '" data-draft="' + path + '" value="' + esc(v) + '" class="' + cls + '"' + (opts.attrs || '') + ' placeholder="' + esc(opts.ph || '') + '">';
    return '<div class="' + (opts.wrap || '') + '"><label class="' + C.label + '" for="' + id + '">' + esc(label) + (opts.optional ? ' <span class="font-normal ' + C.muted + '">(' + t('optional') + ')</span>' : '') + '</label>' + control +
      (e ? '<p class="' + C.err + '" data-err>' + esc(e) + '</p>' : '') + (opts.hint ? '<p class="mt-1 text-xs ' + C.muted + '">' + esc(opts.hint) + '</p>' : '') + '</div>';
  }
  function countryField(path, label) {
    const v = getPath(draft, path); const e = draft.errors[path];
    return '<div><span class="' + C.label + '">' + esc(label) + '</span><button type="button" data-action="draft-country" data-path="' + path + '" class="' + (e ? C.inputErr : C.input) + ' flex items-center gap-2 text-start"><span aria-hidden="true">' + flag(v) + '</span><span class="flex-1 truncate">' + esc(v ? countryName(v) : t('chooseCountry')) + '</span>' + icon('down', 'w-4 h-4 text-slate-400') + '</button>' + (e ? '<p class="' + C.err + '" data-err>' + esc(e) + '</p>' : '') + '</div>';
  }
  function stepBio() {
    const b = draft.bio;

    return '<div class="space-y-4">' +
      '<div class="flex items-center gap-4">' + avatar(b.photo, b.fullName || '?', 'w-20 h-20 text-xl') +
        '<div><label class="' + C.btnSecondary + ' cursor-pointer focus-within:ring-2 focus-within:ring-blue-500">' + icon('upload', 'w-4 h-4') + t(b.photo ? 'changePhoto' : 'uploadPhoto') + '<input type="file" accept="image/jpeg,image/png,image/webp" data-file="photo" class="sr-only"></label>' +
        '<p class="mt-1 text-xs ' + C.muted + '">' + t(draft.uploading === 'photo' ? 'uploading' : 'photoHint') + '</p>' + (draft.errors['bio.photo'] ? '<p class="' + C.err + '" data-err>' + esc(draft.errors['bio.photo']) + '</p>' : '') + '</div></div>' +

      field('education.' + i + '.institution', t('institution')) + field('education.' + i + '.major', t('major')) + '</div>').join('');

      '<div class="grid gap-3 grid-cols-2">' + field('experience.' + i + '.start', t('startMonth'), { type: 'month' }) +

      (draft.errors.education ? '<p class="' + C.err + ' mb-2" data-err>' + esc(draft.errors.education) + '</p>' : '') +
      '<div class="space-y-3">' + (edu || '<p class="text-sm ' + C.muted + '">' + t('noEducationYet') + '</p>') + '</div></section>' +
      '<section><div class="flex items-center justify-between mb-2"><h3 class="font-semibold">' + t('experience') + ' <span class="font-normal text-sm ' + C.muted + '">(' + t('optional') + ')</span></h3><button type="button" data-action="add-entry" data-list="experience" class="' + C.btnGhost + '">' + icon('plus', 'w-4 h-4') + t('addExperience') + '</button></div>' +

  function stepSkills() {

      '<div class="col-span-6">' + field('languages.' + i + '.code', t('language'), { type: 'select', blank: t('choose'), options: LANG_CODES.map(c => [c, langName(c)]).sort((a, b) => a[1].localeCompare(b[1])) }) + '</div>' +

  // Images are downscaled before they are kept so the in-browser store stays small.
  function readFile(file, maxDim) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onerror = () => reject(r.error);
      r.onload = () => {
        if (!maxDim || file.type === 'application/pdf') return resolve(r.result);
        const img = new Image();
        img.onload = () => {
          const k = Math.min(1, maxDim / Math.max(img.width, img.height));
          if (k === 1 && file.size < 400000) return resolve(r.result);
          const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          resolve(cv.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = () => resolve(r.result);
        img.src = r.result;
      };
      r.readAsDataURL(file);
    });
  }

  const appFilters = { skill: '', level: 0, cert: 'any', country: '', minExp: 0, status: '' };
  function applicantRows(j) {
    const f = appFilters;
    let rows = db.applications.filter(a => a.jobId === j.id).map(a => {
      const p = getProfile(a.profileId);
      return p ? { a, p, m: matchJob(j, p.id), certs: certsOf(p.id), exp: experienceYears(p) } : null;
    }).filter(Boolean);
    const total = rows.length;
    rows = rows.filter(({ a, p, certs, exp }) => {
      if (f.status && a.status !== f.status) return false;
      if (f.country && p.country !== f.country) return false;
      if (f.minExp && exp < f.minExp) return false;
      const sk = f.skill.trim().toLowerCase();
      const has = sk ? skillsOf(p.id).find(s => s.name.toLowerCase() === sk) : null;
      if (sk && !has) return false;
      if (f.level && (sk ? has.level < f.level : !skillsOf(p.id).some(s => s.level >= f.level))) return false;
      if (f.cert === 'has' && !certCount(p)) return false;
      if (f.cert === 'skill' && !(sk ? skillProof(p.id, f.skill) === 'certified' : skillsOf(p.id).some(s => skillProof(p.id, s.name) === 'certified'))) return false;
      return true;
    }).sort((x, y) => y.m.pct - x.m.pct);
    return { rows, total };
  }

  /* ==========================================================================
     Routing
     ========================================================================== */
  let renderSeq = 0, lastPath = null;
  async function render() {
    const r = route();
    const [a, b] = r.parts;
    const path = r.parts.join('/');
    const changed = path !== lastPath; lastPath = path;
    const seq = ++renderSeq;
    if (a !== 'register' && draft) draft.stepHash = null;
    renderChrome();
    const view = $('#view');
    let html;
    if (loadState !== 'ready') {
      view.innerHTML = loadState === 'error'
        ? '<div data-testid="load-error">' + emptyState(t('loadFailed'), t('loadFailedBody'), '<button type="button" data-action="retry-load" class="' + C.btnPrimary + '">' + t('retry') + '</button>') + '</div>'
        : spinner();
      return;
    }
    // Screens that show data other people write (applications, a shared
    // profile, an applicant's status) refetch it each time they are opened.
    const co = myCompany();
    if (changed && co && (!a || a === 'dashboard' || a === 'applicant')) {
      view.innerHTML = spinner();
      try { await api.loadCompanyApplications(co.id); } catch (e) { toast(t('loadFailed')); }
      if (seq !== renderSeq) return;
    } else if (changed && a === 'p' && b && !(me && me.profileId === b)) {
      view.innerHTML = spinner();
      try { await api.loadProfile(b); } catch (e) { /* the view shows not-found */ }
      if (seq !== renderSeq) return;
    } else if (changed && a === 'profile' && role() === 'seeker') {
      try { await api.bootstrap(); } catch (e) {}
      if (seq !== renderSeq) return;
    }
    if (a === 'job') {
      view.innerHTML = viewJobSkeleton();
      const j = await api.getJob(b);
      if (seq !== renderSeq) return;
      html = viewJob(j);
    } else if (!a) html = viewHome();
    else if (a === 'jobs') html = viewJobs();
    else if (a === 'saved') html = viewSaved();
    else if (a === 'skills') html = viewSkills();
    else if (a === 'countries') html = viewCountries();
    else if (a === 'auth') html = r.query.get('company') === '1' ? viewCompanySignup() : viewAuth();
    else if (a === 'register') html = viewRegister();
    else if (a === 'profile') html = viewProfile();
    else if (a === 'p') html = viewPublicProfile(b);
    else if (a === 'post') html = viewPost();
    else if (a === 'dashboard') {
      if (b && appFilters.jobId !== b) Object.assign(appFilters, { jobId: b, skill: '', level: 0, cert: 'any', country: '', minExp: 0, status: '' });
      html = b ? viewApplicants(b) : viewDashboard();
    }
    else if (a === 'applicant') html = viewApplicant(b);
    else html = emptyState(t('pageNotFound'), t('pageNotFoundBody'), '<a href="#/" class="' + C.btnPrimary + '">' + t('navHome') + '</a>');
    view.innerHTML = html;
    if (changed) window.scrollTo(0, 0);
    if (a === 'jobs') refreshResults();
  }
  function rerenderKeepFocus(selector) {
    render().then(() => { const el = selector && $(selector); if (el) el.focus({ preventScroll: true }); });
  }

     Events (delegated)

  let debounceT = null;
  function debounced(fn, ms) { clearTimeout(debounceT); debounceT = setTimeout(fn, ms || 250); }
  function onJobs() { return route().parts[0] === 'jobs'; }

  function setBookmarkButtons(id, saved) {
    $$('[data-action="bookmark"][data-id="' + id + '"]').forEach(btn => {
      btn.setAttribute('aria-pressed', saved);
      const svg = btn.querySelector('svg'); if (svg) svg.setAttribute('fill', saved ? 'currentColor' : 'none');
      if (btn.getAttribute('aria-label')) btn.setAttribute('aria-label', t(saved ? 'unsave' : 'save'));
      btn.classList.toggle('text-blue-600', saved); btn.classList.toggle('dark:text-blue-400', saved);
      if (btn.lastChild && btn.lastChild.nodeType === 3) btn.lastChild.textContent = t(saved ? 'saved' : 'save');
    });
  }

  function addSkillFrom(wrapper, name) {
    name = canonicalSkill(name || '');
    const key = wrapper.dataset.skillInput;
    const input = wrapper.querySelector('[data-skill-text]');
    if (!name) { input.focus(); return; }
    SKILL_ADD[key](name);
    const again = $('[data-skill-input="' + key + '"] [data-skill-text]');
    if (again) { again.value = ''; again.focus({ preventScroll: true }); }
  }
  SKILL_ADD.filter = name => {
    if (!filters.skills.some(s => s.toLowerCase() === name.toLowerCase())) filters.skills.push(name);
    refreshFilterHosts(); refreshResults();
  };
  SKILL_ADD.draft = name => {
    if (draft.skills.some(s => s.name.toLowerCase() === name.toLowerCase())) { toast(t('skillExists')); return; }
    draft.skills.push({ id: uid('s'), name, level: 2, years: 1 }); delete draft.errors.skills; render();
  };
  SKILL_ADD['post-required'] = name => addPostSkill('required', name);
  SKILL_ADD['post-nice'] = name => addPostSkill('nice', name);
  function addPostSkill(kind, name) {
    const d = postDraft;
    if (d.required.concat(d.nice).some(s => s.name.toLowerCase() === name.toLowerCase())) { toast(t('skillExists')); return; }
    d[kind].push({ name, level: 2 }); delete d.errors.required; render();
  }
  function suggestExclusions(key) {
    if (key === 'filter') return filters.skills;
    if (key === 'draft') return draft ? draft.skills.map(s => s.name) : [];
    if (postDraft) return postDraft.required.concat(postDraft.nice).map(s => s.name);
    return [];
  }

    box.innerHTML = list.map((s, i) => '<li role="option" id="sg-' + i + '"><button type="button" data-suggest-item="' + esc(s) + '" class="w-full text-start px-3 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-800' + (i === 0 ? ' bg-slate-50 dark:bg-slate-800/60' : '') + '">' + esc(s) + '</button></li>').join('');
    box.classList.toggle('hidden', !list.length);
    input.setAttribute('aria-expanded', list.length ? 'true' : 'false');
  }
  function hideSuggestions() { $$('[data-skill-suggest]').forEach(b => b.classList.add('hidden')); }

  function openCertViewer(c) {

      (certExpired(c) ? '<p class="mt-1 inline-flex items-center gap-1 text-xs font-medium text-amber-700 dark:text-amber-300">' + icon('alert', 'w-3.5 h-3.5') + t('certExpiredLong') + '</p>' : '') + '</div>', { title: t('certificate'), wide: true });

  document.addEventListener('click', async e => {
    const sug = e.target.closest('[data-suggest-item]');
    if (sug) { addSkillFrom(sug.closest('[data-skill-input]'), sug.dataset.suggestItem); hideSuggestions(); return; }
    if (!e.target.closest('[data-skill-input]')) hideSuggestions();
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const act = el.dataset.action;
    const inModal = !!el.closest('[data-modal-body]');
    switch (act) {
      case 'modal-close': closeModal(); break;
      case 'retry-load': boot(); break;
      case 'quick-country':
        openCountryPicker(cc => { filters.country = cc; filters.city = ''; go('#/jobs'); }, { allowAll: true, showCounts: true, title: t('quickCountry') }); break;
      case 'pick-lang': openLanguagePicker(); break;
      case 'toggle-theme': {
        const dark = document.documentElement.classList.contains('dark');
        try { localStorage.setItem('lokerdunia.theme', dark ? 'light' : 'dark'); } catch (err) {}
        if (!window.__applyTheme || window.__applyTheme() === (dark ? 'dark' : 'light')) document.documentElement.classList.toggle('dark', !dark);
        renderChrome(); break;
      }
      case 'bookmark': {
        e.preventDefault();
        let saved;
        try { saved = await api.toggleBookmark(el.dataset.id); } catch (err) { toast(t('saveFailed')); break; }
        toast(t(saved ? 'savedToast' : 'unsavedToast'));
        if (route().parts[0] === 'saved') render(); else setBookmarkButtons(el.dataset.id, saved);
        break;
      }
      case 'pick-category': filters = emptyFilters(); filters.category = el.dataset.cat; go('#/jobs'); break;
      case 'search-skill': filters = emptyFilters(); filters.skills = [el.dataset.skill]; go('#/jobs'); break;
      case 'browse-country': filters = emptyFilters(); filters.country = el.dataset.cc; go('#/jobs'); break;
      case 'browse-rw': filters = emptyFilters(); filters.rw = true; go('#/jobs'); break;
      case 'open-filters': openFiltersModal(); break;
      case 'toggle-match':
        ui.matchMode = !ui.matchMode;
        if (!ui.matchMode && route().query.get('match') === '1') go('#/jobs'); else render();
        break;
      case 'filter-country':
        openCountryPicker(cc => { filters.country = cc; filters.city = ''; refreshFilterHosts(); refreshResults(); if (inModal) openFiltersModal(); }, { allowAll: true, showCounts: true });
        break;
      case 'filter-skill-remove': filters.skills = filters.skills.filter(s => s !== el.dataset.skill); refreshFilterHosts(); refreshResults(); break;
      case 'skill-add': { const w = el.closest('[data-skill-input]'); addSkillFrom(w, w.querySelector('[data-skill-text]').value); hideSuggestions(); break; }
      case 'show-rates': openRates(); break;
      case 'reset-filters': filters = emptyFilters(); renderChrome(); refreshFilterHosts(); refreshResults(); break;
      case 'clear-filter': {
        const k = el.dataset.key, v = el.dataset.val;

      case 'choose-role':

      case 'cd-country': openCountryPicker(cc => { companyDraft.country = cc; delete companyDraft.errors.country; render(); }); break;
      case 'draft-country':
        openCountryPicker(cc => {
          setPath(draft, el.dataset.path, cc); delete draft.errors[el.dataset.path];
          if (el.dataset.path === 'bio.country') { if (!draft.bio.phoneCode) draft.bio.phoneCode = cc; if (!draft.bio.nationality) draft.bio.nationality = cc; }
          render();

      case 'add-entry': {
        const list = el.dataset.list;

        catch (err) {
          openModal('<p class="text-sm mb-2">' + t('copyManually') + '</p><input readonly class="' + C.input + '" value="' + esc(url) + '" data-select-all>', { title: t('shareProfile') });
          const i = $('[data-select-all]'); if (i) i.select();
        }
        break;
      }
      case 'post-country':
        openCountryPicker(cc => { postDraft.country = cc; postDraft.currency = COUNTRY_CURRENCY[cc] || postDraft.currency; postDraft.timezone = COUNTRY_TZ[cc] || postDraft.timezone; delete postDraft.errors.country; render(); }); break;
      case 'post-skill-remove': postDraft[el.dataset.kind].splice(Number(el.dataset.i), 1); render(); break;
      case 'post-lang-add': postDraft.languages.push({ code: 'en', level: 'intermediate' }); render(); break;
      case 'post-lang-remove': postDraft.languages.splice(Number(el.dataset.i), 1); render(); break;
      case 'app-status-tab': appFilters.status = el.dataset.status; render(); break;
      case 'reset-app-filters': Object.assign(appFilters, { skill: '', level: 0, cert: 'any', country: '', minExp: 0, status: '' }); render(); break;
      case 'set-status':
        try { await api.setStatus(el.dataset.app, el.dataset.status); } catch (err) { toast(t('saveFailed')); break; }
        toast(t('statusUpdated', { s: t('status_' + el.dataset.status) })); render(); break;
    }
  });

  document.addEventListener('input', e => {
    const el = e.target;
    if (el.matches('[data-search-input]')) {
      filters.q = el.value;
      $$('[data-search-input]').forEach(i => { if (i !== el) i.value = el.value; });
      if (onJobs()) debounced(refreshResults, 300);
      return;
    }
    if (el.matches('[data-skill-text]')) { showSuggestions(el.closest('[data-skill-input]')); return; }
    if (el.matches('input[data-filter]')) { filters[el.dataset.filter] = el.value; debounced(refreshResults, 350); return; }
    if (el.matches('[data-draft]') && draft) {
      setPath(draft, el.dataset.draft, el.value);
      if (draft.errors[el.dataset.draft]) { delete draft.errors[el.dataset.draft]; const p = el.parentElement.querySelector('[data-err]'); if (p) p.remove(); el.className = C.input; }
      return;
    }
    if (el.matches('[data-cd]')) { companyDraft[el.dataset.cd] = el.value; return; }
    if (el.matches('[data-post]') && postDraft) { postDraft[el.dataset.post] = el.value; return; }
    if (el.matches('[data-country-query]')) {
      countryQuery = el.value;
      const counts = {}; db.jobs.forEach(j => { counts[j.country] = (counts[j.country] || 0) + 1; });
      const list = Object.keys(counts).filter(c => !countryQuery || countryName(c).toLowerCase().includes(countryQuery.toLowerCase())).sort((a, b) => counts[b] - counts[a]);
      $('[data-country-grid]').innerHTML = countryGrid(list, counts, db.jobs.filter(j => j.remoteWorldwide).length);
      return;
    }
    if (el.matches('input[data-app-filter]')) {
      appFilters.skill = el.value;
      debounced(() => { const j = getJob(route().parts[1]); if (j && $('#applicant-list')) $('#applicant-list').innerHTML = applicantList(j); }, 250);
    }
  });

  document.addEventListener('change', async e => {
    const el = e.target;
    if (el.matches('select[data-filter]')) { filters[el.dataset.filter] = el.value; refreshResults(); return; }
    if (el.matches('[data-filter-multi]')) {
      const k = el.dataset.filterMulti;
      filters[k] = el.checked ? filters[k].concat(el.value) : filters[k].filter(x => x !== el.value);
      refreshResults(); return;
    }
    if (el.matches('[data-filter-bool]')) { filters[el.dataset.filterBool] = el.checked; refreshResults(); return; }
    if (el.matches('[data-pref-cur]')) { prefs.cur = el.value; filters.salaryMin = ''; filters.salaryMax = ''; savePrefs(); refreshFilterHosts(); refreshResults(); return; }
    if (el.matches('[data-action-change="sort"]')) { ui.sort = el.value; refreshResults(); return; }
    if (el.matches('[data-insight]')) { insight[el.dataset.insight] = el.value; render(); return; }
    if (el.matches('[data-draft-check]') && draft) { setPath(draft, el.dataset.draftCheck, el.checked); render(); return; }
    if (el.matches('select[data-draft]') && draft) {
      const path = el.dataset.draft;
      setPath(draft, path, /^skills\.\d+\.level$/.test(path) ? Number(el.value) : el.value);
      if (/^skills\.\d+\.level$/.test(path)) rerenderKeepFocus('[data-draft="' + path + '"]');
      return;
    }
    if (el.matches('[data-cert-skill]') && draft) {
      const s = draft.certForm.skills;
      draft.certForm.skills = el.checked ? s.concat(el.value) : s.filter(x => x !== el.value);
      return;
    }
    if (el.matches('[data-file]') && draft) {
      const file = el.files && el.files[0]; if (!file) return;
      const which = el.dataset.file;
      const okTypes = which === 'photo' ? ['image/jpeg', 'image/png', 'image/webp'] : ['image/jpeg', 'image/png', 'application/pdf'];
      const errKey = which === 'photo' ? 'bio.photo' : 'certForm.file';
      delete draft.errors[errKey];
      if (!okTypes.includes(file.type)) draft.errors[errKey] = t(which === 'photo' ? 'errPhotoType' : 'errFileType');
      else if (file.size > 5 * 1024 * 1024) draft.errors[errKey] = t('errFileSize');
      else {
        try {
          const dataUrl = await readFile(file, which === 'photo' ? 320 : 1600);
          const type = dataUrl.startsWith('data:application/pdf') ? 'application/pdf' : (dataUrl.slice(5, dataUrl.indexOf(';')) || file.type);
          // Preview straight away from the local copy, then store the file.
          if (which === 'cert') draft.certForm.file = { dataUrl, type, name: file.name, size: file.size, url: '', id: '', uploading: type !== 'application/pdf' };
          draft.uploading = which; await render();
          const stored = type === 'application/pdf' ? null : await uploadImage(dataUrl, file.name, which === 'photo' ? 'public' : 'private');
          draft.uploading = null;
          if (which === 'photo') {
            if (stored) draft.bio.photo = stored.url; else draft.errors[errKey] = t('uploadUnavailable');
          } else {
            Object.assign(draft.certForm.file, { uploading: false, url: stored ? stored.url : '', id: stored ? stored.id : '', localOnly: !stored });
            if (!stored) toast(t(type === 'application/pdf' ? 'pdfNotStored' : 'uploadUnavailable'));
          }
        } catch (err) { draft.uploading = null; draft.errors[errKey] = t('errFileRead'); }
      }
      await render(); if (draft.errors[errKey]) focusFirstError();
      return;
    }
    if (el.matches('[data-privacy]')) {
      const p = myProfile(); if (!p) return;
      const next = { ...p.privacy, [el.dataset.privacy]: el.checked };
      try { await api.setPrivacy(next); toast(t('privacySaved')); }
      catch (err) { el.checked = !el.checked; toast(t('saveFailed')); }
      return;
    }
    if (el.matches('[data-cd]')) { companyDraft[el.dataset.cd] = el.value; return; }
    if (el.matches('select[data-post]') && postDraft) { postDraft[el.dataset.post] = el.value; return; }
    if (el.matches('[data-post-bool]') && postDraft) { postDraft[el.dataset.postBool] = el.checked; return; }
    if (el.matches('[data-post-level]') && postDraft) { postDraft[el.dataset.postLevel][Number(el.dataset.i)].level = Number(el.value); return; }
    if (el.matches('[data-post-lang]') && postDraft) { postDraft.languages[Number(el.dataset.i)][el.dataset.postLang] = el.value; return; }
    if (el.matches('select[data-app-filter]')) {
      const k = el.dataset.appFilter;
      appFilters[k] = (k === 'level' || k === 'minExp') ? Number(el.value) : el.value;
      const j = getJob(route().parts[1]); if (j) $('#applicant-list').innerHTML = applicantList(j);
    }
  });

  document.addEventListener('submit', async e => {
    const form = e.target;
    if (form.matches('[data-search-form]')) {
      e.preventDefault();
      filters.q = form.querySelector('input').value;
      form.querySelector('input').blur();
      if (onJobs()) refreshResults(); else go('#/jobs');
      return;
    }
    const kind = form.dataset.form;
    if (!kind) return;
    e.preventDefault();
    if (kind === 'register') {
      const errs = validateStep(draft.step);
      if (Object.keys(errs).length) { draft.errors = errs; await render(); focusFirstError(); return; }
      draft.errors = {};
      if (draft.step < 4) { draft.step++; await render(); window.scrollTo(0, 0); return; }
      const f = draft.certForm;
      if (f.file || f.name.trim()) {
        const ce = validateCertForm();
        if (Object.keys(ce).length) { draft.errors = ce; await render(); focusFirstError(); toast(t('finishCertFirst')); return; }
        draft.certificates.push({ ...f, id: uid('c'), skills: f.skills.slice() }); draft.certForm = blankCert();
      }
      finishRegister(form.querySelector('[data-finish]'));
    }
    if (kind === 'company-signup') {
      const d = companyDraft; d.errors = {};
      if (!d.name.trim()) d.errors.name = t('errRequired');
      if (!d.country) d.errors.country = t('errRequired');
      if (!d.city.trim()) d.errors.city = t('errRequired');
      if (Object.keys(d.errors).length) { await render(); focusFirstError(); return; }
      const btn = form.querySelector('[type=submit]'); btn.disabled = true;
      let co;
      try { co = await api.createCompany({ name: d.name.trim(), country: d.country, city: d.city.trim(), industry: d.industry }); }
      catch (err) {
        btn.disabled = false;
        if (err.code === 'name_taken') { d.errors.name = t('errNameTaken'); await render(); focusFirstError(); } else toast(t('saveFailed'));
        return;
      }
      postDraft = null;
      toast(t('welcomeCompany', { co: co.name }));
      go('#/dashboard');
    }
    if (kind === 'apply') {
      const btn = form.querySelector('[data-submit]');
      btn.disabled = true; btn.innerHTML = '<span class="w-4 h-4 rounded-full border-2 border-white/40 border-t-white animate-spin motion-reduce:animate-none"></span>' + t('sending');
      const j = getJob(form.dataset.job);
      const certIds = $$('input[name="cert"]:checked', form).map(i => i.value);
      try { await api.apply(j.id, certIds, form.querySelector('[name="message"]').value.trim()); }
      catch (err) {
        btn.disabled = false; btn.textContent = t('sendApplication');
        toast(t(err.code === 'already_applied' ? 'alreadyAppliedErr' : 'saveFailed'));
        if (err.code === 'already_applied') { closeModal(); api.bootstrap().then(render); }
        return;
      }
      closeModal();
      toast(t('applySuccess', { co: companyOf(j).name }));
      render();
    }
    if (kind === 'post') submitPost(form.querySelector('[data-submit]'));
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if ($$('[data-skill-suggest]:not(.hidden)').length) { hideSuggestions(); return; } if (modalClose) { closeModal(); return; } }
    if (e.key === 'Enter' && e.target.matches('[data-skill-text]')) {
      e.preventDefault();
      const w = e.target.closest('[data-skill-input]');
      const first = w.querySelector('[data-suggest-item]');
      const typed = e.target.value.trim();
      const exact = suggestSkills(typed, []).find(s => s.toLowerCase() === typed.toLowerCase());
      addSkillFrom(w, exact || (first && !w.querySelector('[data-skill-suggest]').classList.contains('hidden') ? first.dataset.suggestItem : typed));
      hideSuggestions();
    }
  });

  window.addEventListener('hashchange', () => { closeModal(); render(); });
  window.addEventListener('usernode:theme-changed', () => renderChrome());

  /* ---------- boot ---------- */
  async function boot() {
    // A saved language other than English is fetched before the first paint.
    try { await loadLang(lang); }
    catch (e) { console.warn(e.message); lang = DEFAULT_LANG; }
    loadState = 'loading'; render();
    try { await api.bootstrap(); loadState = 'ready'; }
    catch (e) { console.warn('bootstrap failed: ' + e.message); loadState = 'error'; }
    lastPath = null; render();
  }
  (function start() {
    // Shared profile links arrive as /p/<id>; the app itself routes by hash.
    const m = location.pathname.match(/^\/p\/([A-Za-z0-9_-]+)\/?$/);
    if (m) history.replaceState(null, '', '/' + location.search + '#/p/' + m[1]);
    if (window.usernode && usernode.issueState && usernode.issueState.register) {
      usernode.issueState.register(() => ({ route: location.hash, role: role(), lang, loadState, jobs: db.jobs.length, applications: db.applications.length, filters: { ...filters, q: filters.q ? '[set]' : '' } }));
    }
    boot();
  })();
  </script>
</body>
</html>
